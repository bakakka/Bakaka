const form=document.getElementById("exam");
let currentSection="";
questions.forEach((q,i)=>{
  if(q[0] && q[0]!==currentSection){ currentSection=q[0]; form.insertAdjacentHTML("beforeend",`<div class="section">${currentSection}</div>`); }
  const [sec,text,opts,ans]=q;
  let html=`<div class="q"><h3>${text}</h3>`;
  opts.forEach((o,j)=>html+=`<label><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`);
  html+=`</div>`;
  form.insertAdjacentHTML("beforeend",html);
});

let remaining=120*60;
const timerEl=document.getElementById("timer");
const interval=setInterval(()=>{
  remaining--;
  const h=Math.floor(remaining/3600),m=Math.floor((remaining%3600)/60),s=remaining%60;
  timerEl.textContent=[h,m,s].map((x,k)=>String(x).padStart(2,"0")).join(":");
  if(remaining<=0){clearInterval(interval); submitExam(true);}
},1000);

function submitExam(auto=false){
  if(!auto && !confirm("Are you sure you want to submit the exam?")) return;
  clearInterval(interval);
  let score=0, unanswered=0;
  questions.forEach((q,i)=>{
    const selected=document.querySelector(`input[name="q${i}"]:checked`);
    if(!selected) unanswered++;
    else if(Number(selected.value)===q[3]) score++;
  });
  const percent=(score/questions.length*100).toFixed(2);
  const name=document.getElementById("studentName").value.trim()||"Student";
  document.querySelectorAll("input").forEach(x=>x.disabled=true);
  document.getElementById("result").style.display="block";
  document.getElementById("result").innerHTML=`<h2>Exam Result</h2>
  <p><b>Student:</b> ${escapeHtml(name)}</p>
  <p><b>Score:</b> ${score} / ${questions.length}</p>
  <p><b>Percentage:</b> ${percent}%</p>
  <p><b>Unanswered:</b> ${unanswered}</p>
  <p>${auto?"Time finished. The exam was submitted automatically.":"Your exam has been submitted."}</p>`;
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
